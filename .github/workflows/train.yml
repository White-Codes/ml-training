name: Uncapped Continuous ML Training

on:
  workflow_dispatch:

jobs:
  run-training:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Clone Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          pip install xgboost optuna \
            scikit-learn pandas numpy \
            matplotlib seaborn scipy \
            joblib tqdm skl2onnx \
            onnxruntime onnx psutil onnxmltools

      # ── Restore artifacts from previous session ──
      - name: Restore Relay Cache
        uses: actions/cache@v4
        with:
          path: xgb_trader_artifacts/
          key: trader-artifacts-latest
          restore-keys: |
            trader-artifacts-

      # ── Pull latest checkpoints committed to git ──
      - name: Pull Latest Artifacts from Git
        run: |
          git pull origin main || true

      - name: Run Training Session
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          timeout 5.5h python3 train.py || true

      # ── Always commit progress before exit ────────
      - name: Commit and Push Artifacts
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A xgb_trader_artifacts/ || true
          git stash || true
          git pull origin main --rebase || true
          git stash pop || true
          git add -A xgb_trader_artifacts/ || true
          git diff --staged --quiet || git commit -m "Auto-save model artifacts [skip ci]"
          git push origin main || true

      # ── Read session progress ──
      - name: Check Training Progress
        id: check_progress
        if: always()
        run: |
          STEPS=0
          if [ -f xgb_trader_artifacts/session_progress.json ]; then
            STEPS=$(python3 -c "import json; print(json.load(open('xgb_trader_artifacts/session_progress.json')).get('steps_run', 0))")
          fi
          echo "steps_run=${STEPS}" >> "$GITHUB_OUTPUT"
          echo "Steps run this session: ${STEPS}"

      # ── Auto-trigger next session if work was done ──
      - name: Auto-Trigger Next Session
        if: success() && steps.check_progress.outputs.steps_run > 100
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Uncapped Continuous ML Training" --ref main || true
